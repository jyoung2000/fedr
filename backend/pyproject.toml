[project]
name = "fedr"
version = "0.1.0"
description = "FEDR - self-hosted, capital-preserving crypto arbitrage platform (port 8935)"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "aiosqlite>=0.20",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "ccxt>=4.4",
  "cryptography>=43",
  "web3>=7.6,<8",
  "solders>=0.21",
  "solana>=0.35",
  "httpx>=0.27",
  "websockets>=12",
  "orjson>=3.10",
  "structlog>=24",
  "qrcode>=7.4",
  "eth-account>=0.13",
  "mnemonic>=0.21",
  "pynacl>=1.5",
  "base58>=2.1",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "hypothesis>=6", "ruff>=0.5", "mypy>=1.10"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["fedr*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501", "B008"]
