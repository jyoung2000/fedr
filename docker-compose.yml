# FEDR - default deployment (PAPER mode). `docker compose up -d` then open http://localhost:8935
# Overlays: docker-compose.dev.yml | .paper.yml | .testnet.yml | .live.yml
name: fedr

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: fedr/app:latest
    container_name: fedr-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      FEDR_PORT: "8935"
      FEDR_BIND: "0.0.0.0"
      FEDR_DATA_DIR: /data
      FEDR_GATEWAY_URL: http://gateway:15888
    ports:
      # bound to the host loopback only - put a reverse proxy with TLS in front to expose it
      - "127.0.0.1:${FEDR_PORT:-8935}:8935"
    volumes:
      - ./data:/data
    depends_on:
      gateway:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8935/api/system/health', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m
    networks:
      - fedr-internal

  gateway:
    image: ${GATEWAY_IMAGE:-hummingbot/gateway:version-2.16.0}
    container_name: fedr-gateway
    restart: unless-stopped
    environment:
      GATEWAY_PASSPHRASE: ${GATEWAY_PASSPHRASE:?set GATEWAY_PASSPHRASE in .env}
      DEV: "true"                # plain HTTP on the private compose network only (no host port is published)
      GATEWAY_BIND_ADDRESS: 0.0.0.0
      GATEWAY_ENABLE_DOCS: "false"
    # NOTE: no `ports:` - Gateway is reachable only from the app container.
    volumes:
      - ./gateway/conf:/home/gateway/conf
      - ./gateway/logs:/home/gateway/logs
      - ./gateway/certs:/home/gateway/certs
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:15888/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    networks:
      - fedr-internal

networks:
  fedr-internal:
    driver: bridge
